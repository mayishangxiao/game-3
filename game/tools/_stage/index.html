<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>觉醒年代 · 鸦片战争像素 RPG</title>
<style>
  :root{
    --ink:#0d0b14; --night:#1c1a2b; --panel:#2f2b45; --line:#6b6478;
    --red:#c0392b; --gold:#d4a840; --paper:#f2ede4; --dim:#948dab;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; justify-content:center; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    line-height:1.6;
  }
  .wrap{width:100%; max-width:560px;}
  header{
    border:2px solid var(--line); background:var(--night);
    padding:22px 18px; margin-bottom:14px;
  }
  h1{font-size:26px; letter-spacing:2px; color:var(--gold);}
  .sub{color:var(--dim); font-size:13px; margin-top:4px; letter-spacing:1px;}
  .intro{
    border:1px solid var(--line); background:var(--panel);
    padding:14px 16px; margin-bottom:14px; font-size:14px;
  }
  .intro b{color:var(--red);}
  h2{font-size:14px; color:var(--gold); margin:16px 0 8px; letter-spacing:2px;}
  .act{
    border:1px solid var(--line); background:var(--night);
    padding:10px 14px; margin-bottom:8px; font-size:14px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .act small{color:var(--dim);}
  .tag{font-size:11px; padding:2px 8px; border:1px solid var(--gold); color:var(--gold); white-space:nowrap;}
  .tag.soon{border-color:var(--line); color:var(--dim);}
  .controls{
    border:1px solid var(--line); background:var(--panel);
    padding:12px 16px; font-size:13px; color:var(--paper);
  }
  .controls kbd{
    display:inline-block; border:1px solid var(--line); padding:0 6px; margin:0 2px;
    background:var(--night); border-radius:3px; color:var(--gold);
  }
  .start{
    display:block; width:100%; margin-top:18px; padding:16px;
    background:var(--red); color:var(--paper); text-align:center;
    font-size:20px; letter-spacing:6px; text-decoration:none;
    border:2px solid var(--gold);
  }
  .start:active{background:#8c1c1c;}
  footer{margin-top:14px; text-align:center; color:var(--dim); font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>觉醒年代</h1>
    <div class="sub">鸦片战争 · 像素 RPG ｜ 党史课程作业</div>
  </header>

  <div class="intro">
    1839 年，林则徐虎门销烟。次年，英军兵临广州。<br>
    你扮演关天培，在大炮打不穿铁壳的绝望中，打完这一仗。<br>
    <b>这一战历史上打输了——你要做的不是胜利，是亲眼看见它怎么输的。</b>
  </div>

  <h2>章节目录</h2>
  <div class="act">
    <div>第一幕 · 虎门销烟与炮台之战<small> ｜ 1839–1841</small></div>
    <span class="tag">已开放</span>
  </div>
  <div class="act">
    <div>第二幕 · 从金田到天京<small> ｜ 1853–1864</small></div>
    <span class="tag">已开放</span>
  </div>
  <div class="act">
    <div>后续章节</div>
    <span class="tag soon">制作中</span>
  </div>

  <h2>操作</h2>
  <div class="controls">
    左侧 <kbd>摇杆</kbd> 移动 ｜ 右下 <kbd>攻</kbd> 攻击 ｜ <kbd>闪</kbd> 闪避<br>
    建议<strong style="color:var(--gold)">横屏</strong>游玩；电脑上用鼠标点按屏幕按钮。
  </div>

  <a class="start" href="/game/">开始游戏</a>

  <footer>党史像素 RPG · 觉醒年代 ｜ 数据与史实以课程要求为准</footer>
</div>
</body>
</html>
