    <style>:root{--ink:#0d0b14;--red:#c62828;--paper:#f2ede4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--ink);width:100%;height:100%;color:var(--paper);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;margin:0;padding:0;font-family:PingFang SC,Microsoft YaHei,Hiragino Sans GB,sans-serif;overflow:hidden}#game-root{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);position:fixed;top:0;bottom:0;left:0;right:0}#game-root canvas{display:block}#rotate-hint{background:radial-gradient(circle at 50% 45%, #241b2e 0%, var(--ink) 72%);z-index:200;text-align:center;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px;display:none;position:fixed;top:0;bottom:0;left:0;right:0}#rotate-hint.show{display:flex}#rotate-hint .icon{font-size:52px;line-height:1;animation:2.4s ease-in-out infinite spin}#rotate-hint .rh-title{letter-spacing:.18em;color:var(--paper);text-shadow:0 2px #4a1520;font-size:20px}#rotate-hint p{color:#c2bcd1;letter-spacing:.08em;margin:0;font-size:14px;line-height:1.7}@keyframes spin{0%,to{transform:rotate(0)}50%{transform:rotate(90deg)}}#tap-gate{background:radial-gradient(circle at 50% 42%, #241b2e 0%, var(--ink) 70%);z-index:300;text-align:center;flex-direction:column;justify-content:center;align-items:center;gap:10px;transition:opacity .28s;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#tap-gate.hidden{opacity:0;pointer-events:none}#tap-gate .tg-title{letter-spacing:.16em;color:var(--paper);text-shadow:0 2px #4a1520;font-size:26px}#tap-gate .tg-sub{letter-spacing:.34em;color:#9a93ae;font-size:11px}#tap-gate.hidden .tg-row{pointer-events:none}#tap-gate .tg-row{align-items:center;gap:12px;margin-top:26px;display:flex}#tap-gate .tg-go,#tap-gate .tg-rot{letter-spacing:.2em;cursor:pointer;-webkit-tap-highlight-color:transparent;background:0 0;border:1px solid #6b2330;border-radius:2px;padding:9px 18px;font-size:14px}#tap-gate .tg-go{color:var(--red);animation:1.6s ease-in-out infinite pulse}#tap-gate .tg-rot{color:#c2bcd1;align-items:center;gap:6px;display:none}#tap-gate .tg-rot:active{color:var(--paper);background:#6b2330}#tap-gate .tg-rot .rb-icon{color:var(--red);font-size:15px;line-height:1}@media (orientation:portrait){#tap-gate .tg-rot{display:inline-flex}}#tap-gate .tg-tip{letter-spacing:.22em;color:#857c9c;margin-top:4px;font-size:11px;display:none}@media (orientation:portrait){#tap-gate .tg-tip{display:block}}@keyframes pulse{0%,to{opacity:.55}50%{opacity:1}}html.rot #game-root{transform-origin:0 0;width:100vh;height:100vw;padding:0;position:fixed;top:0;bottom:auto;left:0;right:auto;transform:translate(100vw)rotate(90deg)}html.rot #rotate-hint{display:none}html.rot:not(.started) #tap-gate{position:fixed;top:0;bottom:0;left:0;right:0}html.rot:not(.started) #tap-gate .tg-row{justify-content:center;margin-top:8px}html.rot:not(.started) #tap-gate .tg-in{flex-direction:column;justify-content:center;align-items:center;gap:10px;width:100%;height:100%;display:flex}#rotate-btn{z-index:250;letter-spacing:.12em;color:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent;background:#1a1424db;border:1px solid #6b2330;border-radius:3px;align-items:center;gap:6px;padding:8px 12px;font-size:12px;display:none;position:fixed;top:10px;right:10px}#rotate-btn.show{display:inline-flex}#rotate-btn:active{background:#6b2330}#rotate-btn .rb-icon{color:var(--red);font-size:14px;line-height:1}#rotate-btn.on .rb-txt:after{content:"（已横屏）";color:#857c9c;letter-spacing:0;font-size:10px}html.rot #rotate-btn{transform-origin:0 0;pointer-events:none;background:0 0;border:0;border-radius:0;width:100vh;height:100vw;padding:0;display:block;position:fixed;top:0;left:0;right:auto;transform:translate(100vw)rotate(90deg)}html.rot #rotate-btn>*{pointer-events:auto}html.rot #rotate-btn .rb-inner{letter-spacing:.12em;color:var(--paper);background:#1a1424db;border:1px solid #6b2330;border-radius:3px;align-items:center;gap:6px;padding:8px 12px;font-size:12px;display:inline-flex;position:absolute;top:10px;right:10px}html.rot #rotate-btn .rb-inner,html.rot #rotate-btn .rb-inner *{pointer-events:auto}#boot-hint{background:var(--ink);z-index:90;pointer-events:none;letter-spacing:.3em;color:#6b6489;justify-content:center;align-items:center;font-size:13px;transition:opacity .35s;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#boot-hint.hidden{opacity:0;pointer-events:none}</style>

  </head>
  <body>
    <div id="game-root"></div>

    <div id="boot-hint">正 在 唤 醒 一 八 四 〇 年</div>

    <!-- 游戏内「横屏」按钮：竖屏才显示（样式与显隐都在 OrientationGate.updateRotateButton） -->
    <div id="rotate-btn" role="button" tabindex="0" aria-label="强制横屏">
      <span class="rb-inner"><span class="rb-icon">⟳</span><span class="rb-txt">横屏</span></span>
    </div>

    <div id="tap-gate">
      <!-- tg-in 只是「反向旋转」的载体：横屏兜底时 #tap-gate 整体转了 90°，
           这一层再转回来，玩家看到的仍是正的文字、左右并排的两个按钮。 -->
      <div class="tg-in">
        <div class="tg-title">党史像素 RPG</div>
        <div class="tg-sub">觉 醒 年 代 · 1840—1921</div>
        <div class="tg-row">
          <button type="button" class="tg-go">点 击 屏 幕 开 始</button>
          <button type="button" class="tg-rot" aria-label="横屏"><span class="rb-icon">⟳</span>横屏</button>
        </div>
        <div class="tg-tip">点一下自动横屏</div>
      </div>
    </div>

    <div id="rotate-hint">
      <div class="icon">▭</div>
      <div class="rh-title">请 横 屏</div>
      <p>把手机横过来<br />战场比竖屏宽一倍</p>
    </div>

    <!--
      引导层的「先手」：主模块还没下完时用户就会点（隧道/弱网下这是常态）。
      以前这一下点了完全没反馈，看起来就是「点不动」。现在立刻改文案，并且记住点过 ——
      等主模块就绪后提示「再点一下」，因为全屏和锁屏都要求「新手势」，不能拿旧点击硬开。
    -->
    <script>
      (function () {
        var gate = document.getElementById('tap-gate');
        if (!gate) return;
        var go = gate.querySelector('.tg-go');
        var timer = null;
        // 计时器把「我在等」变成「它在动」：弱网/隧道下首屏要几秒到十几秒，
        // 只写「载入中」用户会以为卡死，写秒数就知道没白等。
        function tick() {
          if (window.__dshGate) {
            // 主模块已接管：停掉计时，文案交给它
            if (timer) clearInterval(timer);
            timer = null;
            return;
          }
          var sec = Math.round((Date.now() - started) / 1000);
          if (go) go.textContent = '载 入 中 ' + sec + 's …';
        }
        var started = 0;
        function pre() {
          // 引导层已由主模块接管：交给它（它才能用这一下手势去全屏/锁屏）
          if (window.__dshGate) return;
          window.__tapGatePending = true;
          if (!started) {
            started = Date.now();
            if (go) {
              go.style.animation = 'none';
              go.style.opacity = '1';
            }
            timer = setInterval(tick, 1000);
            tick();
          }
        }
        gate.addEventListener('pointerdown', pre);
        gate.addEventListener('touchstart', pre, { passive: true });
        // 只挂 click：这里必须**逐击生效**（pre 自带 started 开关，每次点击都会重新计时），
        // 不能像主模块那样挂 pointerdown/touchstart —— 那样「横屏」按钮的 pointerdown
        // 冒泡上来会先把 gate 当成「点任意处开始」，按钮就白做了。
        gate.addEventListener('click', pre);

        // 「横屏」按钮：只转画面，不离开这一屏。它是独立的新手势，
        // 所以必须拦住冒泡 —— 否则会连带触发上面的 pre()/「点任意处开始」。
        // 主模块起来之前没人能锁屏，这里先把容器用 CSS 转过去（与 html.rot 同一套样式），
        // 主模块接管后 reflow() 会按真实状态重算，要撤就撤。
        var rot = gate.querySelector('.tg-rot');
        if (rot) {
          var stop = function (e) {
            e.preventDefault();
            e.stopPropagation();
          };
          rot.addEventListener('pointerdown', stop);
          rot.addEventListener('touchstart', stop, { passive: false });
          rot.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            // 主模块已接管：用自定义事件显式通知它（它走「新手势重新申请全屏 + 锁屏」那条路）。
            // 为什么要自定义事件而不是直接让它听这个 click：点击必须 stopPropagation，
            // 否则会在 gate 上被当成「点任意处开始」，两个按钮就白做了。
            // 也**不要**去 click() 游戏内的 #rotate-btn —— 那个按钮的点击会冒泡到 document，
            // 它的处理逻辑会把引导层当成已开始、直接关掉。
            window.__gateRotTapped = (window.__gateRotTapped || 0) + 1;
            window.dispatchEvent(new CustomEvent('dsh:gate-rotate'));
            // 主模块还没起来（弱网/隧道）：先用 CSS 把画面转过去，至少这一下有反应。
            // 主模块接管后 reflow() 会按真实状态重算，要撤就撤。
            if (!window.__dshGate) document.documentElement.classList.add('rot');
          });
        }
      })();
    </script>

    <!--
      Phaser 不在应用 bundle 里：1.17 MB 经隧道传到手机要一分多钟（实测 70 s），
      改由 src/vendor/loadPhaser.ts 先取 CDN、失败再退回同目录的本地副本。
      这里不放 <script> 标签 —— 阻塞脚本一旦挂住，页面会一直停在引导层。
    -->

    <!--
      手机排障面板：地址栏加 ?dbg=1 才出现。
      故意写成内联脚本（不打包）：即使主模块加载失败，它也能报出 UA / 视口 / 触摸坐标，
      这样「点不动」才有证据可查，而不是靠猜。
    -->
    <script>
      (function () {
        var diag = { taps: 0, last: null, errors: [], game: false };
        window.__dshDiag = diag;
        window.addEventListener('error', function (e) {
          diag.errors.push(String((e && e.message) || 'error'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          diag.errors.push('reject: ' + String((e && e.reason && e.reason.message) || e.reason));
        });
        if (!/[?&]dbg=1/.test(location.search)) {
          window.addEventListener(
            'touchstart',
            function (e) {
              var t = e.touches && e.touches[0];
              if (t) diag.last = { cx: Math.round(t.clientX), cy: Math.round(t.clientY) };
            },
            { passive: true },
          );
          return;
        }

        var box = document.createElement('pre');
        box.style.cssText =
          'position:fixed;left:0;top:0;z-index:999;margin:0;padding:4px 6px;' +
          'font:9px/1.35 ui-monospace,Menlo,monospace;color:#9ef;background:rgba(0,0,0,.72);' +
          'pointer-events:none;white-space:pre;max-width:100%;';
        document.addEventListener('DOMContentLoaded', function () {
          document.body.appendChild(box);
        });

        window.addEventListener(
          'touchstart',
          function (e) {
            var t = e.touches && e.touches[0];
            if (!t) return;
            diag.taps += 1;
            var mapped = null;
            try {
              mapped = window.__dshGate && window.__dshGate.map ? window.__dshGate.map(t.clientX, t.clientY) : null;
            } catch (err) {
              diag.errors.push('map: ' + err.message);
            }
            diag.last = {
              cx: Math.round(t.clientX),
              cy: Math.round(t.clientY),
              gx: mapped ? Math.round(mapped.x) : null,
              gy: mapped ? Math.round(mapped.y) : null,
            };
          },
          { passive: true },
        );

        function line() {
          var vv = window.visualViewport;
          var g = window.__dshGame;
          var gate = window.__dshGate || {};
          var scenes = '';
          try {
            scenes = g ? g.scene.getScenes(true).map(function (s) { return s.scene.key; }).join(',') : '';
          } catch (err) {
            scenes = 'err';
          }
          diag.game = !!g;
          var L = diag.last;
          return [
            'UA ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 46),
            'win ' + window.innerWidth + 'x' + window.innerHeight + ' dpr' + (window.devicePixelRatio || 1),
            'vv  ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + '@' + Math.round(vv.offsetTop) : '-'),
            'scr ' + screen.width + 'x' + screen.height + ' ori' + (screen.orientation ? screen.orientation.type : '-'),
            'game ' + (g ? 'ok' : 'NO') + ' scenes ' + scenes,
            'gate tap' + (gate.tapped ? 1 : 0) + ' rot' + (gate.rotated ? 1 : 0) + ' lock' + (gate.locked ? 1 : 0) + ' fs' + (gate.fullscreen ? 1 : 0),
            'html ' + document.documentElement.className,
            'tap#' + diag.taps + ' ' + (L ? L.cx + ',' + L.cy + ' -> ' + L.gx + ',' + L.gy : '-'),
            'ptr ' + (g ? Math.round(g.input.activePointer.x) + ',' + Math.round(g.input.activePointer.y) : '-'),
            'err ' + (diag.errors.length ? diag.errors[diag.errors.length - 1].slice(0, 40) : 'none'),
          ].join('\n');
        }

        setInterval(function () {
          if (box.parentNode) box.textContent = line();
        }, 400);
      })();
    </script>

  </body>
